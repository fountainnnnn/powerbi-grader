[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

sqlalchemy.url =

[migration]
file_template = %%(rev)s_%%(slug)s
directory = alembic/versions
version_location_template = alembic/versions/%%(rev)s_%%(slug)s.py
version_path_separator = /
recursive_version_path = false

[alembic]
script_location = alembic

pre_exec =

post_exec =

sqlalchemy.url = driver://user:pass@localhost/dbname

revision_environment = false

compare_type = false

compare_server_default = false

include_object =

include_schemas = false

render_as_batch = true

literal_binds = true

paramstyle = named

defaults_to_cascade = true

want_unicode_literals = true

target_metadata = src.db.models:Base
